# Additional operator-facing context.
subtext: |
  Idle timeout applies decode policy to incomplete units. Permanent rotation
  emits terminal evidence with Ack-gated progress or quarantines without progress.
  The terminal-record metric replaces the obsolete partial-bytes-dropped metric.
