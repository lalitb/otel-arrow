apiVersion: v1
kind: Namespace
metadata:
  name: otel-demo
---
# 1. The Service Account for the CLIENT (the app sending telemetry)
# This is the identity that will be verified by the extension.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-sender
  namespace: otel-demo
---
# 2. The Service Account for the COLLECTOR (the app running the extension)
# This identity needs permission to call the TokenReview API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: otel-demo
---
# 3. ClusterRole to allow creating TokenReviews
# This is required for the extension to validate tokens against the K8s API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-token-reviewer
rules:
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
---
# 4. Bind the Role to the Collector Service Account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-token-reviewer-binding
subjects:
- kind: ServiceAccount
  name: otel-collector
  namespace: otel-demo
roleRef:
  kind: ClusterRole
  name: otel-collector-token-reviewer
  apiGroup: rbac.authorization.k8s.io
