[package]
name = "otap-df-extension"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Extension system for OTAP dataflow pipeline engine"

[dependencies]
async-trait = "0.1"
k8s-openapi = { version = "0.22.0", features = ["v1_28"] }
kube = { version = "0.94.2", features = ["runtime", "client", "oauth", "rustls-tls"] }
linkme = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
