[package]
name = "drop_logs_by_service"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = false
strip = true

[dependencies]
otap-df-plugin-abi = { path = "../../../../plugin-abi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
