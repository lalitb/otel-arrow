nodes:
  receiver:
    type: "urn:otel:receiver:otlp"
    config:
      protocols:
        grpc:
          listening_addr: 127.0.0.1:4317
          max_decoding_message_size: "32MiB"

  filter:
    type: "urn:otel:processor:filter"
    config:
      profiles:
        include:
          match_type: strict
          sample_attributes:
            - key: profile.source
              value: ebpf-synthetic
        compact: true
        dense_ids: true

  rename_source:
    type: "urn:otel:processor:attribute"
    config:
      actions:
        - action: rename
          source_key: profile.source
          destination_key: profile.source.staged
          apply_to: ["signal"]

  restore_source:
    type: "urn:otel:processor:attribute"
    config:
      actions:
        - action: rename
          source_key: profile.source.staged
          destination_key: profile.source
          apply_to: ["signal"]

  durable_buffer:
    type: "urn:otel:processor:durable_buffer"
    config:
      path: "${BUFFER_PATH}"
      poll_interval: 10ms
      retention_size_cap: "192 MiB"
      size_cap_policy: backpressure
      max_segment_open_duration: 50ms

  exporter:
    type: "urn:otel:exporter:otap"
    config:
      grpc_endpoint: http://127.0.0.1:4318
      compression_method: none
      arrow:
        payload_compression: none

connections:
  - from: receiver
    to: filter
  - from: filter
    to: rename_source
  - from: rename_source
    to: restore_source
  - from: restore_source
    to: durable_buffer
  - from: durable_buffer
    to: exporter
