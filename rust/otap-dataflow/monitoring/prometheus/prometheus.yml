global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otap-dataflow
    metrics_path: /metrics
    params:
      format: [prometheus]
    static_configs:
      # The engine's HTTP admin endpoint.
      # Adjust the target to match your engine config (default: 127.0.0.1:8085).
      - targets: ["host.docker.internal:8085"]
        labels:
          instance: local
