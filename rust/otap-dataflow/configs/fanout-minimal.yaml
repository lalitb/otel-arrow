# Minimal fan-out pipeline (single downstream processor)
# Purpose: isolate ChannelSendError by removing secondary debug processor and multi-branch edges.
# Topology:
#   receiver -> fanout -> debug -> noop
# Fanout still engaged (single destination) to validate no error on simple case.

settings:
  default_pipeline_ctrl_msg_channel_size: 100
  default_node_ctrl_msg_channel_size: 100
  default_pdata_channel_size: 100

nodes:
  receiver:
    kind: receiver
    plugin_urn: "urn:otel:otap:fake_data_generator:receiver"
    default_out_port: out
    out_ports:
      out:
        destinations:
          - fanout
        dispatch_strategy: round_robin
    config:
      traffic_config:
        max_signal_count: 50
        max_batch_size: 25
        signals_per_second: 25
        log_weight: 100
      registry_path: https://github.com/open-telemetry/semantic-conventions.git[model]

  fanout:
    kind: processor
    plugin_urn: "urn:otel:fanout:processor"
    default_out_port: out
    config: {}
    out_ports:
      out:
        destinations:
          - debug
        dispatch_strategy: round_robin

  debug:
    kind: processor
    plugin_urn: "urn:otel:debug:processor"
    default_out_port: out_port
    out_ports:
      out_port:
        destinations:
          - noop
        dispatch_strategy: round_robin
    config:
      verbosity: basic

  noop:
    kind: exporter
    plugin_urn: "urn:otel:noop:exporter"
    config: {}
