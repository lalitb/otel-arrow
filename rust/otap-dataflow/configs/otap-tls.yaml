settings:
  default_pipeline_ctrl_msg_channel_size: 100
  default_node_ctrl_msg_channel_size: 100
  default_pdata_channel_size: 100

nodes:
  receiver:
    kind: receiver
    plugin_urn: "urn:otel:otap:receiver"
    out_ports:
      out_port:
        destinations:
          - batch
        dispatch_strategy: round_robin
    config:
      listening_addr: "127.0.0.1:4320"
      response_stream_channel_size: 100
      tls:
        cert_file: "test_certs/server.crt"
        key_file: "test_certs/server.key"
        client_ca_file: "test_certs/ca.crt"  # Enables mTLS - remove to disable client auth
        reload_interval: "30s"  # Hot-reload certificates
  batch:
    kind: processor
    plugin_urn: "urn:otel:batch:processor"
    out_ports:
      out_port:
        destinations:
          - debug
        dispatch_strategy: round_robin
    config:
      send_batch_size: 100
      timeout: 5s
  debug:
    kind: processor
    plugin_urn: "urn:otel:debug:processor"
    out_ports:
      out_port:
        destinations:
          - noop
        dispatch_strategy: round_robin
    config:
      verbosity: detailed
  noop:
    kind: exporter
    plugin_urn: "urn:otel:noop:exporter"
    config:
